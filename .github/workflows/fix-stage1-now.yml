name: Stage 1 - fix mobile menu

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only the existing mobile navigation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) The mobile breakpoint was overriding the base width with 88vw.
          old_css = '.mobile-nav{width:min(88vw,360px);padding-left:24px;padding-right:24px;}'
          new_css = '.mobile-nav{width:min(82vw,340px);padding-left:24px;padding-right:24px;}'
          if old_css not in s:
              raise SystemExit('Expected mobile width override not found; refusing to modify the site.')
          s = s.replace(old_css, new_css, 1)

          # 2) Make the overlay receive taps only while open.
          old_overlay = ".nav-overlay{display:none; position:fixed; inset:0; background:rgba(42,21,24,.4); z-index:90; opacity:0; transition:opacity .3s ease;}"
          new_overlay = ".nav-overlay{display:none; position:fixed; inset:0; background:rgba(42,21,24,.4); z-index:90; opacity:0; pointer-events:none; transition:opacity .3s ease;}"
          if old_overlay not in s:
              raise SystemExit('Expected overlay CSS not found; refusing to modify the site.')
          s = s.replace(old_overlay, new_overlay, 1)
          s = s.replace('.nav-overlay.open{display:block; opacity:1;}', '.nav-overlay.open{display:block; opacity:1; pointer-events:auto;}', 1)

          # 3) Replace only the mobile-menu portion of the existing script.
          pattern = re.compile(r"  // menu mobile\n.*?  // accordion FAQ", re.S)
          match = pattern.search(s)
          if not match:
              raise SystemExit('Existing mobile menu script not found; refusing to modify the site.')

          replacement = '''  // menu mobile — Stage 1 UX fix
  const burger = document.getElementById('burger');
  const mobileNav = document.getElementById('mobile-nav');
  const overlay = document.getElementById('nav-overlay');
  let lockedScrollY = 0;

  function closeMenu(){
    lockedScrollY = Math.max(0, lockedScrollY);
    burger.setAttribute('aria-expanded','false');
    burger.setAttribute('aria-label','Abrir menu');
    mobileNav.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow='';
    window.scrollTo(0, lockedScrollY);
  }

  function openMenu(){
    lockedScrollY = window.scrollY;
    burger.setAttribute('aria-expanded','true');
    burger.setAttribute('aria-label','Fechar menu');
    mobileNav.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
  }

  burger.addEventListener('click', () => burger.getAttribute('aria-expanded')==='true' ? closeMenu() : openMenu());
  overlay.addEventListener('click', closeMenu);
  mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  document.addEventListener('keydown', (event) => { if(event.key === 'Escape' && burger.getAttribute('aria-expanded')==='true') closeMenu(); });
  window.addEventListener('resize', () => { if(window.innerWidth > 900 && burger.getAttribute('aria-expanded')==='true') closeMenu(); }, {passive:true});

  // Ao recarregar, sempre iniciar no Hero/topo e remover a âncora anterior.
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  window.addEventListener('load', () => {
    if(location.hash){ history.replaceState(null, document.title, location.pathname + location.search); }
    requestAnimationFrame(() => window.scrollTo(0,0));
    setTimeout(() => window.scrollTo(0,0), 50);
  });
  window.addEventListener('pageshow', (event) => { if(event.persisted) window.scrollTo(0,0); });

  // accordion FAQ'''

          s = s[:match.start()] + replacement + s[match.end():]

          if s == original:
              raise SystemExit('No changes were made.')
          p.write_text(s, encoding='utf-8')
          print('Stage 1 patch applied.')
          PY

      - name: Verify the patch before committing
        run: |
          grep -F 'width:min(82vw,340px)' index.html
          grep -F 'pointer-events:auto' index.html
          grep -F "history.scrollRestoration='manual'" index.html
          grep -F "window.scrollTo(0,0)" index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: finalize mobile menu UX and reload to hero"
          git push
